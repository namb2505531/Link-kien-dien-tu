<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/home-page.css">
    <script src="https://kit.fontawesome.com/7544d93d31.js" crossorigin="anonymous"></script>
    <title>ElectroShop</title>
</head>
<body>
    <div id="main">
        <!-- Begin header Đặng Hoàng Nam -->
        <header id="header">
            <div class="grid">
                <div class="header-with-search" >
                    <a class="header__logo text-gradient" href="home-page.html">
                        <img src="./assets/img/logo-img.png" alt="" class="header__logo-img" >
                        <div class="header__logo-title">
                            <h3 class="header__title-heading">ELECTROSHOP</h3>
                            <p class="header__title-sub-heading">PC & HARDWARE SPECIALIST</p>
                        </div>
                    </a> 
                    <div class="header__search">
                        <i class="fa-solid fa-magnifying-glass header__search-icon"></i>
                        <input type="text" class="header__search-input" placeholder="Tìm kiếm CPU Intel Core i7, RTX 4090, RAM ĐR5...">
                        <button class="header__search-btn">Tìm kiếm</button>
                    </div>
                    <button class="header__account-btn">
                        <i class="fa-solid fa-user header__account-icon" ></i>
                        Đăng nhập
                    </button>
                    <button id="js-cart-notify" class="header__cart-btn header__notify">
                        <i class="fa-solid fa-cart-shopping header__cart-icon" ></i>
                        
                    </button>
                </div>

                <ul class="header__nav">
                    <li><a href="product.html">TẤT CẢ SẢN PHÂM</a></li>
                    <li><a href="#deals">SIÊU SALE NGHẬP TRÀN</a></li>
                    <li><a href="#components">CÁC LINH KIỆN</a></li>
                    <li><a href="#footer">GIỚI THIỆU</a></li>
                </ul>
                    
                
            </div>
        </header>
        <!-- End header Đặng Hoàng Nam -->
         <div id="content">
            <div class="grid">
                <div id="slider">
                    <div class="slider__content">
                        <button class="slider__content-next-btn">
                            <i class="fa-solid fa-angle-right slider__content-next-btn-icon" ></i>
                        </button>
                        <button class="slider__content-previous-btn slider__content-previous-btn-icon">
                            <i class="fa-solid fa-angle-left" ></i>
                        </button>
                        <div class="slider__content-title">
                            <h2 class="slider__content-heading">Intel Core i9 
                                <span class="slider__content-heading text-gradient">14900KS</span>
                            </h2>
                            <p class="slider__content-sub-heading">Xung nhịp kỷ lục 6.3Ghz, 24 Nhân 32 luồng - Sức mạnh vô song cho Streamer &
                                Creator</p>
                            <button class="slider__content-detail-btn">Xem cấu hình</button>
                        </div>
                    </div>
                </div>
                
                <div id="deals" class="deals__content">
                    <div class="deas__content-banner">
                        <div class="deas__content-banner-title">
                            <i class="fa-solid fa-bolt deas__content-title-icon"></i>
                            <span>
                                <h2 class="deas__content-title-heading">FLASH DEALS - GIỜ VÀNG GIÁ SỐC</h2>
                            <p class="deas__content-title-sub-heading">Số lượng có hạn. Nhanh tay kẻo hết!</p>
                            </span>
                        </div>
                        <div class="countdown">
                            <ul class="clock">
                                <li></li>
                                <li></li>
                                <li></li>
                            </ul>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                        </div>
                    </div>
                    <ul class="deals__content-list">
                        
                    </ul>
                
                </div>
                
                <div id="components">
                
                </div>
                
                <div id="products">
                
                </div>
            </div>
            
         </div>
        
        
        <div id="footer">

        </div>
    </div>
    <script>
        
    </script>
</body>
</html>
